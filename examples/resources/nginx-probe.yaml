#
# nginx example with liveness probe (HTTP GET / on port 80)
# Used to verify the NodeAgent liveness probe feature.
#
# Expected log output after deployment (periodSeconds=10s interval):
#   [Probe] Checking liveness probe for container 'nginx'
#   [Probe] Liveness probe for container 'nginx': HTTP GET / on port 80 - Success
#
# Failure test: run `podman exec nginx pkill nginx` to stop nginx inside the
# container.  After 3 consecutive failures (failureThreshold=3) the NodeAgent
# will stop the container:
#   [Probe] Liveness probe failed (1/3)
#   [Probe] Liveness probe failed (2/3)
#   [Probe] Liveness probe failed (3/3)
#   [NodeAgent] Stopping container 'nginx' due to liveness probe failure
apiVersion: v1
kind: Scenario
metadata:
  name: nginx
spec:
  condition: null
  action: launch
  target: nginx
---
apiVersion: v1
kind: Package
metadata:
  label: null
  name: nginx
spec:
  pattern:
    - type: plain
  models:
    - name: nginx
      node: HPC
      resources:
        volume:
        network:
---
apiVersion: v1
kind: Model
metadata:
  name: nginx
  annotations:
    io.piccolo.annotations.package-type: nginx
    io.piccolo.annotations.package-name: nginx
    io.piccolo.annotations.package-network: default
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: docker.io/library/nginx:latest
  restartPolicy: Always
  probeConfig:
    liveness:
      http:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
